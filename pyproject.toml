[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-accessibility-checker"
version = "1.0.0"
description = "Structural PDF accessibility checks (tags, title, language, alt text, reading order) using pikepdf"
authors = [{name = "Geoffrey Montague"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["pikepdf>=8"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pdfa11y = "pdfa11y.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
